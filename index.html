<script>
  // Si le téléphone affiche la page en « version ordinateur », on la recale sur la largeur réelle de l'écran.
  (function () {
    var w = screen.width;
    if (navigator.maxTouchPoints > 0 && w < 700 && window.innerWidth > w * 1.4) {
      document.documentElement.classList.add('mode-pc');
      document.documentElement.style.setProperty('--k', window.innerWidth / w);
    }
  })();
</script>

<style>
  /* Boîte de nuit 70's : nuit violette, boule à facettes qui projette ses éclats, piste de danse lumineuse, néons rose, cyan et jaune. Un seul thème, volontairement sombre. */
  :root {
    color-scheme: dark;
    --nuit: #0c0518;
    --nuit-2: #1d0a35;
    --rose: #ff2fb3;
    --cyan: #22e6ff;
    --jaune: #ffd23f;
    --orange: #ff7a1a;
    --violet: #9b5cff;
    --chrome: #e9e9f4;
    --brume: #c3b3e6;
    --display: 'Monoton', 'Righteous', Impact, sans-serif;
    --neon: 'Righteous', 'Outfit', system-ui, sans-serif;
    --texte: 'Outfit', system-ui, -apple-system, sans-serif;
    --fig: clamp(64px, 11dvh, 88px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; background: var(--nuit); }
  body {
    font-family: var(--texte);
    min-height: 100vh; min-height: 100dvh;
    background:
      radial-gradient(90% 55% at 50% 0%, #3b1066 0%, transparent 62%),
      radial-gradient(70% 40% at 0% 100%, rgba(255,47,179,.28) 0%, transparent 70%),
      radial-gradient(70% 40% at 100% 100%, rgba(34,230,255,.2) 0%, transparent 70%),
      linear-gradient(180deg, var(--nuit-2), var(--nuit));
    background-color: var(--nuit);
    background-attachment: fixed;
    color: var(--chrome);
    text-align: center;
    display: flex; justify-content: center;
    overflow-x: hidden;
    padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  html.mode-pc body { width: calc(100vw / var(--k)); min-height: calc(100vh / var(--k)); transform: scale(var(--k)); transform-origin: 0 0; }

  .decor { position: fixed; pointer-events: none; z-index: 0; }
  #lumieres { inset: 0; width: 100%; height: 100%; }

  /* Piste de danse en perspective, dalles qui s'allument au rythme */
  .piste { left: -30%; right: -30%; bottom: 0; height: 30dvh; perspective: 340px; perspective-origin: 50% 0%; overflow: hidden;
    -webkit-mask-image: linear-gradient(to top, #000 30%, transparent); mask-image: linear-gradient(to top, #000 30%, transparent); }
  .dalles { position: absolute; left: 0; right: 0; bottom: -10%; height: 150%; transform: rotateX(62deg); transform-origin: 50% 100%;
    display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: 1fr; gap: 4px; padding: 4px; background: #05020b; }
  .dalle { border-radius: 2px; background: var(--c); opacity: .14; transition: opacity .25s, box-shadow .25s; }
  .dalle.on { opacity: .9; box-shadow: 0 0 18px var(--c), inset 0 0 10px rgba(255,255,255,.5); }

  main { position: relative; z-index: 1; width: 100%; max-width: 420px; min-height: calc(100dvh - max(12px, env(safe-area-inset-top)) - max(16px, env(safe-area-inset-bottom))); display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.6dvh, 14px); }
  .jeu { width: 100%; display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.6dvh, 14px); margin-block: auto; }
  header { display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.2dvh, 10px); }

  .plaque { margin-top: clamp(10px, 2.2dvh, 22px); margin-bottom: clamp(4px, 1dvh, 10px); }
  .logo {
    display: block; width: clamp(170px, 25dvh, 240px); max-width: 60vw; height: auto;
    filter: brightness(0) invert(1) drop-shadow(0 0 6px rgba(255,47,179,.9)) drop-shadow(0 0 16px rgba(155,92,255,.6));
  }

  .titres { display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.2dvh, 10px); }
  h1 {
    font-family: var(--display); font-weight: 400;
    font-size: clamp(1.9rem, 5.4dvh, 2.6rem); line-height: 1.15; letter-spacing: .02em; text-wrap: balance;
    color: #fff;
    text-shadow: 0 0 4px #fff, 0 0 10px var(--rose), 0 0 22px var(--rose), 0 0 40px var(--violet);
    animation: neon 4s ease-in-out infinite;
  }
  @keyframes neon {
    0%,100% { text-shadow: 0 0 4px #fff, 0 0 10px var(--rose), 0 0 22px var(--rose), 0 0 40px var(--violet); }
    50% { text-shadow: 0 0 4px #fff, 0 0 10px var(--cyan), 0 0 22px var(--cyan), 0 0 40px var(--violet); }
    92% { opacity: 1; } 94% { opacity: .55; } 96% { opacity: 1; }
  }
  .subtitle { font-family: var(--neon); font-size: clamp(.95rem, 2.3dvh, 1.08rem); letter-spacing: .03em; color: var(--jaune); text-shadow: 0 0 10px rgba(255,210,63,.55); }

  .piece { position: relative; width: 100%; margin: calc(var(--fig) * .95) 0 clamp(6px, 1.6dvh, 16px); }
  .vinyle { position: absolute; right: 12px; bottom: calc(100% - 22px); width: calc(var(--fig) * 1.05); height: auto; animation: tourne 1.8s linear infinite; filter: drop-shadow(0 4px 10px rgba(0,0,0,.6)); }
  .vinyle.vite { animation-duration: .45s; }
  @keyframes tourne { to { transform: rotate(360deg); } }

  .card {
    position: relative;
    width: 100%;
    min-height: clamp(140px, 22dvh, 200px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    font-family: var(--texte); font-size: clamp(1.25rem, 3dvh, 1.55rem); font-weight: 600; line-height: 1.35;
    text-wrap: balance; overflow-wrap: anywhere;
    color: #fff;
    border: 3px solid transparent; border-radius: 20px;
    background:
      linear-gradient(160deg, rgba(36,12,66,.94), rgba(14,6,28,.96)) padding-box,
      conic-gradient(from var(--a, 0deg), var(--rose), var(--orange), var(--jaune), var(--cyan), var(--violet), var(--rose)) border-box;
    box-shadow: 0 0 22px rgba(255,47,179,.35), 0 0 44px rgba(34,230,255,.18), 0 14px 40px rgba(0,0,0,.55);
    animation: arcenciel 6s linear infinite;
    transition: transform .4s cubic-bezier(.175,.885,.32,1.275), box-shadow .3s;
  }
  @property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  @keyframes arcenciel { to { --a: 360deg; } }
  .card.placeholder { font-weight: 400; color: var(--brume); }
  .card.limit { color: var(--jaune); text-shadow: 0 0 12px rgba(255,210,63,.5); }
  .card.stopped { transform: scale(1.04); box-shadow: 0 0 30px rgba(255,47,179,.6), 0 0 70px rgba(34,230,255,.35), 0 14px 40px rgba(0,0,0,.55); animation-duration: 1.5s; }

  button {
    position: relative; overflow: hidden;
    width: 100%; min-height: 60px; margin-top: 4px; padding: 16px 0;
    font-family: var(--neon); font-size: 1.2rem; letter-spacing: .2em; text-transform: uppercase;
    color: #1a0b2e;
    background:
      linear-gradient(180deg, #ffffff 0%, #d9d9e8 30%, #9a9ab4 55%, #e6e6f2 75%, #b4b4cc 100%);
    border: none; border-radius: 50px; cursor: pointer;
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
    box-shadow: 0 0 0 2px rgba(255,255,255,.35), 0 0 22px rgba(34,230,255,.45), 0 0 40px rgba(255,47,179,.3), inset 0 1px 0 #fff;
    transition: transform .2s, box-shadow .3s;
  }
  button::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(105deg, transparent 30%, rgba(255,47,179,.45) 42%, rgba(255,210,63,.5) 50%, rgba(34,230,255,.45) 58%, transparent 70%);
    background-size: 250% 100%; mix-blend-mode: overlay;
    animation: reflet 2.8s linear infinite;
  }
  @keyframes reflet { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
  @media (hover: hover) { button:hover { transform: translateY(-2px); box-shadow: 0 0 0 2px rgba(255,255,255,.5), 0 0 30px rgba(34,230,255,.6), 0 0 54px rgba(255,47,179,.45), inset 0 1px 0 #fff; } }
  button.running { color: #fff; background: linear-gradient(135deg, var(--rose) 0%, var(--violet) 100%); box-shadow: 0 0 26px rgba(255,47,179,.7), 0 0 50px rgba(155,92,255,.45), inset 0 1px 0 rgba(255,255,255,.35); }
  button:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
  button:disabled::after { display: none; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
  // Boule à facettes qui tourne, éclats de lumière qui balaient la salle, projecteurs, piste qui clignote
  (function () {
    const c = document.getElementById('lumieres');
    const ctx = c.getContext('2d');
    const teintes = ['255,47,179', '34,230,255', '255,210,63', '255,122,26', '155,92,255', '255,255,255'];
    const calme = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let W, H, eclats = [];

    function boule() {
      const r = Math.max(30, Math.min(54, W * .12));
      return { x: W - r - Math.max(10, W * .04), y: r + 34, r };
    }

    function taille() {
      const q = Math.min(devicePixelRatio || 1, 2);
      W = c.clientWidth; H = c.clientHeight; c.width = W * q; c.height = H * q; ctx.setTransform(q, 0, 0, q, 0, 0);
      eclats = Array.from({ length: 34 }, () => ({
        x: Math.random(), y: Math.random(), v: .00004 + Math.random() * .00006,
        r: 2 + Math.random() * 4.5, t: teintes[Math.floor(Math.random() * teintes.length)], p: Math.random() * 6.28
      }));
    }

    function projecteur(x, y, angle, teinte, a) {
      ctx.save();
      ctx.translate(x, y); ctx.rotate(angle);
      const L = Math.hypot(W, H) * 1.1;
      const g = ctx.createLinearGradient(0, 0, 0, L);
      g.addColorStop(0, `rgba(${teinte},${a})`); g.addColorStop(1, `rgba(${teinte},0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(6, 0); ctx.lineTo(L * .2, L); ctx.lineTo(-L * .2, L); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    function dessinerBoule(b, rot) {
      // fil
      ctx.strokeStyle = 'rgba(233,233,244,.6)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(b.x, 0); ctx.lineTo(b.x, b.y - b.r); ctx.stroke();
      // halo
      const h = ctx.createRadialGradient(b.x, b.y, b.r * .6, b.x, b.y, b.r * 2.4);
      h.addColorStop(0, 'rgba(255,255,255,.18)'); h.addColorStop(1, 'rgba(155,92,255,0)');
      ctx.fillStyle = h; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2.4, 0, 6.283); ctx.fill();
      // facettes
      ctx.save();
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); ctx.fillStyle = '#4a4a5c'; ctx.fill(); ctx.clip();
      const nLat = 12, nLon = 24;
      for (let i = 0; i < nLat; i++) {
        const p1 = -Math.PI / 2 + Math.PI * i / nLat, p2 = -Math.PI / 2 + Math.PI * (i + 1) / nLat;
        for (let j = 0; j < nLon; j++) {
          const t1 = rot + 2 * Math.PI * j / nLon, t2 = rot + 2 * Math.PI * (j + 1) / nLon;
          const tm = (t1 + t2) / 2, pm = (p1 + p2) / 2;
          if (Math.cos(tm) <= 0) continue;
          const pt = (p, t) => [b.x + b.r * Math.cos(p) * Math.sin(t), b.y - b.r * Math.sin(p)];
          const a = pt(p1, t1), bb = pt(p1, t2), cc = pt(p2, t2), d = pt(p2, t1);
          // lumière venant d'en haut à gauche
          const nx = Math.cos(pm) * Math.sin(tm), ny = Math.sin(pm), nz = Math.cos(pm) * Math.cos(tm);
          let l = Math.max(0, -nx * .45 + ny * .55 + nz * .7);
          const scint = Math.sin(i * 12.9898 + j * 78.233 + rot * 9) ;
          let v = 70 + l * 150;
          let col = `rgb(${v|0},${v|0},${(v + 14)|0})`;
          if (scint > .93) col = '#ffffff';
          else if (scint < -.97) col = `rgb(${teintes[(i + j) % 5]})`;
          ctx.fillStyle = col;
          ctx.strokeStyle = 'rgba(20,10,35,.55)'; ctx.lineWidth = .7;
          ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(bb[0], bb[1]); ctx.lineTo(cc[0], cc[1]); ctx.lineTo(d[0], d[1]); ctx.closePath();
          ctx.fill(); ctx.stroke();
        }
      }
      const o = ctx.createRadialGradient(b.x - b.r * .35, b.y - b.r * .4, b.r * .1, b.x, b.y, b.r);
      o.addColorStop(0, 'rgba(255,255,255,.25)'); o.addColorStop(.7, 'rgba(0,0,0,0)'); o.addColorStop(1, 'rgba(10,4,20,.55)');
      ctx.fillStyle = o; ctx.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
      ctx.restore();
    }

    function dessiner(temps) {
      ctx.clearRect(0, 0, W, H);
      const b = boule();
      const rot = temps / 2600;

      ctx.globalCompositeOperation = 'lighter';
      // projecteurs qui balaient depuis le haut
      projecteur(W * .08, -10, -.35 + Math.sin(temps / 2300) * .45, '255,47,179', .16);
      projecteur(W * .5, -10, Math.sin(temps / 3100 + 1) * .55, '255,210,63', .09);
      projecteur(b.x, b.y, Math.PI / 2 + .9 + Math.sin(temps / 2700 + 2) * .4, '34,230,255', .12);

      // éclats renvoyés par la boule : ils glissent sur les murs
      for (const e of eclats) {
        const x = ((e.x + (calme ? 0 : temps * e.v)) % 1) * W;
        const y = e.y * H + Math.sin(temps / 1400 + e.p) * 8;
        const a = .55 + .45 * Math.sin(temps / 500 + e.p);
        const g = ctx.createRadialGradient(x, y, 0, x, y, e.r * 3.2);
        g.addColorStop(0, `rgba(${e.t},${a})`); g.addColorStop(.35, `rgba(${e.t},${a * .45})`); g.addColorStop(1, `rgba(${e.t},0)`);
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, e.r * 3.2, 0, 6.283); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';

      dessinerBoule(b, rot);
      if (!calme) requestAnimationFrame(dessiner);
    }
    taille(); addEventListener('resize', () => { taille(); if (calme) requestAnimationFrame(dessiner); }); requestAnimationFrame(dessiner);

    // Piste de danse
    const piste = document.getElementById('dalles');
    const couleurs = ['#ff2fb3', '#22e6ff', '#ffd23f', '#ff7a1a', '#9b5cff'];

      d.style.setProperty('--c', couleurs[(i * 7 + Math.floor(i / 12) * 3) % couleurs.length]);
      piste.appendChild(d); dalles.push(d);
    }
    function rythme() {
      for (const d of dalles) d.classList.toggle('on', Math.random() < .28);
    }
    rythme();
    if (!calme) setInterval(rythme, 480);

    // Le vinyle accélère pendant le défilement
    const vinyle = document.getElementById('vinyle');
    const bouton = document.getElementById('actionBtn');
    new MutationObserver(() => vinyle.classList.toggle('vite', bouton.classList.contains('running')))
      .observe(bouton, { attributes: true, attributeFilter: ['class'] });
  })();
</script>

    // ---- Pioche mélangée ----
    // Les défis sont mélangés comme un jeu de cartes (mélange de Fisher-Yates, avec le générateur
    // aléatoire sécurisé du navigateur). On pioche dans l'ordre : aucun défi ne revient avant que
    // tous soient passés. La pioche est mémorisée sur l'appareil : elle survit à un rechargement
    // de la page (par exemple après le QR code), donc on ne repart pas toujours des mêmes défis.
    const CLE = 'defis-disco-pioche-v1';
    let pioche = [];   // défis dans l'ordre du mélange
    let position = 0;  // prochain défi à tirer

    function hasard(n) {
      // Entier aléatoire équitable entre 0 et n-1
      if (window.crypto && crypto.getRandomValues) {
        const max = Math.floor(0x100000000 / n) * n;
        const buf = new Uint32Array(1);
        do { crypto.getRandomValues(buf); } while (buf[0] >= max);
        return buf[0] % n;
      }
      return Math.floor(Math.random() * n);
    }

    function melanger(liste) {
      const a = [...liste];
      for (let i = a.length - 1; i > 0; i--) {
        const j = hasard(i + 1);
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function sauver() {
      try { localStorage.setItem(CLE, JSON.stringify({ pioche, position })); } catch (e) {}
    }

    function nouvellePioche(dernier) {
      pioche = melanger(tousLesDefis);
      // Le premier défi du nouveau tour ne doit pas être celui qui vient de sortir
      if (dernier && pioche[0] === dernier && pioche.length > 1) {
        const j = 1 + hasard(pioche.length - 1);
        [pioche[0], pioche[j]] = [pioche[j], pioche[0]];
      }
      position = 0;
    }

    function chargerPioche() {
      try {
        const sauvegarde = JSON.parse(localStorage.getItem(CLE));
        // On réutilise la pioche seulement si la liste de défis n'a pas changé
        const memeListe = sauvegarde
          && Array.isArray(sauvegarde.pioche)
          && sauvegarde.pioche.length === tousLesDefis.length
          && sauvegarde.pioche.every(d => tousLesDefis.includes(d))
          && Number.isInteger(sauvegarde.position);
        if (memeListe) {
          pioche = sauvegarde.pioche;
          position = sauvegarde.position;
          return;
        }
      } catch (e) {}
      nouvellePioche(null);
      sauver();
    }

    function piocherDefi() {
      if (position >= pioche.length) nouvellePioche(pioche[pioche.length - 1]);
      const d = pioche[position++];
      sauver();
      return d;
    }

    chargerPioche();

    const MAX_DEFIS = 5;
    const MESSAGE_FIN = "Flash le QR code pour continuer";

    // Seul le lien du QR code (adresse de la page suivie de ?suite ou #suite) donne 5 nouveaux défis.
    const CLE_COMPTEUR = 'defis-disco-compteur-v1';
    function lireCompteur() {
      try { const n = parseInt(localStorage.getItem(CLE_COMPTEUR), 10); return Number.isInteger(n) && n > 0 ? n : 0; } catch (e) { return 0; }
    }
    function sauverCompteur() {
      try { localStorage.setItem(CLE_COMPTEUR, String(tires)); } catch (e) {}
    }

      const viaQR = /(^|[?&])suite(=|&|$)/.test(location.search.slice(1)) || location.hash === '#suite';
      if (!viaQR) return;

      sauverCompteur();
      // On efface ?suite de l'adresse, sinon un simple rafraîchissement redonnerait des défis
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
    })();

    const btn = document.getElementById('actionBtn');
    let intervalId = null;
    let isRunning = false;
    let affiche = null;

    // Pendant le défilement : simple effet visuel, le vrai défi est tiré au STOP
    function defilement() {
      let d;
      do {
        d = tousLesDefis[hasard(tousLesDefis.length)];
      } while (d === affiche && tousLesDefis.length > 1);
      affiche = d;
      card.textContent = d;

    }

    function toggleLoop() {
      if (isRunning) {

        btn.classList.remove('running');
        card.classList.add('stopped');
        if (navigator.vibrate) navigator.vibrate(60);
        launchConfetti();
      } else {
        // Limite atteinte : le message remplace le défi et le bouton se bloque
        if (tires >= MAX_DEFIS) {
          card.textContent = MESSAGE_FIN;
          card.classList.remove('stopped', 'placeholder');
          card.classList.add('limit');
          btn.disabled = true;
          return;

        isRunning = true;
        btn.textContent = "Stop !";
        btn.classList.add('running');
        card.classList.remove('stopped', 'placeholder');
        intervalId = setInterval(defilement, 60);
      }
    }

    if (tires >= MAX_DEFIS) {
      card.textContent = MESSAGE_FIN;
      card.classList.remove('stopped', 'placeholder');
      card.classList.add('limit');
      btn.disabled = true;
    }
